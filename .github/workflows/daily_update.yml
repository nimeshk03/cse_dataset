name: Daily CSE Data Update

on:
  schedule:
    # Run at 20:00 UTC (01:30 Sri Lanka time, after CSE close at 14:30 LKT)
    - cron: '0 20 * * 1-5'
  workflow_dispatch:  # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest OHLCV prices
        run: python scripts/02_collect_prices.py --mode incremental

      - name: Merge into parquet
        run: python scripts/02b_merge_data.py

      - name: Clean prices
        run: python scripts/06_clean_prices.py

      - name: Engineer features
        run: python scripts/07_engineer_features.py

      - name: Fetch latest macro data
        run: python scripts/05_collect_macro.py

      - name: Scrape latest LBO news
        run: python scripts/04a_scrape_lbo.py

      - name: Run sentiment analysis
        run: python scripts/04c_sentiment_analysis.py

      - name: Build unified dataset
        run: python scripts/08_build_unified.py

      - name: Generate quality report
        run: python scripts/09_quality_report.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/published/ DATA_QUALITY_REPORT.md
          git diff --staged --quiet || git commit -m "chore(data): daily update $(date -u +%Y-%m-%d)"
          git push
