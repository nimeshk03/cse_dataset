name: Daily CSE Data Update

on:
  schedule:
    # Run at 20:00 UTC (01:30 Sri Lanka time, after CSE close at 14:30 LKT)
    - cron: '0 20 * * 1-5'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Smoke check runtime
        run: uv run python scripts/smoke_check.py

      - name: Run daily update
        run: uv run python scripts/daily_update.py

      - name: Publish to Hugging Face if configured
        run: uv run python scripts/publish_huggingface.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}

      - name: Publish to Kaggle if configured
        run: uv run python scripts/publish_kaggle.py
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_DATASET_SLUG: ${{ vars.KAGGLE_DATASET_SLUG }}

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/published/ DATA_QUALITY_REPORT.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): daily update $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
